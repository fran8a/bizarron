<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png?v=bizarron" />
    <meta name="theme-color" content="#101d19" />
    <script>
      (() => {
        let selected;
        try {
          selected = localStorage.getItem("bizarron.theme.v1");
        } catch {}
        const theme =
          selected === "dark" || selected === "light"
            ? selected
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor = `var(--page, ${theme === "dark" ? "#101814" : "#f5f5ed"})`;
        document.documentElement.style.color = `var(--text, ${theme === "dark" ? "#edf2e9" : "#182d25"})`;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#101814" : "#f5f5ed";
      })();
    </script>
    <meta name="referrer" content="no-referrer" />
    <title>Bizarrón · Pizarra táctica de fútbol online</title>
    <meta
      name="description"
      content="La pizarra de los pibes. Armá formaciones de fútbol 7 y 11, mové jugadores y compartí jugadas en tiempo real. Gratis, sin registro y sin vueltas."
    />
    <meta property="og:site_name" content="Bizarrón" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bizarrón · La pizarra de los pibes" />
    <meta
      property="og:description"
      content="Mucho potrero. Un poco de estrategia. Armá tu equipo de fútbol 7 u 11 y compartí la pizarra con los pibes. Todos editan en tiempo real."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Bizarrón · La pizarra de los pibes" />
    <meta
      name="twitter:description"
      content="Armá tu equipo de fútbol 7 u 11 y compartí la pizarra con los pibes. Gratis. Sin registro. Sin vueltas."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
